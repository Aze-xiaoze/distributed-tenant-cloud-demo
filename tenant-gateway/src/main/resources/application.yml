server:
  port: 8086

spring:
  application:
    name: tenant-gateway
  profiles:
    active: dev
  # Redis配置（网关需要访问Redis检查Token黑名单）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
  cloud:
    gateway:
      # 路由配置
      routes:
        # 认证服务路由（仅HTTP接口，gRPC调用不经过网关）
        - id: tenant-auth
          uri: lb://tenant-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0
            # 限流配置：认证服务每租户每IP 10次/秒，防止暴力破解
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@tenantIpKeyResolver}"

        # 系统管理服务路由
        - id: tenant-system
          uri: lb://tenant-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
            # 限流配置：系统管理每租户每IP 20次/秒
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@tenantIpKeyResolver}"

        # 文件服务路由（文件上传/下载走独立路由，便于独立限流和监控）
        - id: tenant-file
          uri: lb://tenant-system
          predicates:
            - Path=/file/**
          filters:
            - StripPrefix=0
            # 文件服务限流：每租户每IP 5次/秒（文件操作较重）
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@tenantIpKeyResolver}"

      # 跨域配置（安全收窄：生产环境禁止allowed-origins为*配合allow-credentials:true）
      globalcors:
        cors-configurations:
          '[/**]':
            # 安全收窄：仅允许可信来源域，生产环境应配置为实际前端域名
            # 示例：allowed-origins: https://app.tenant.com,https://admin.tenant.com
            allowed-origins:
              - "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
              - X-Tenant-ID
              - X-Request-Id
            allow-credentials: true
            max-age: 3600

    # Sentinel 熔断降级配置
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8079}
        port: 8719
      eager: true
      # 持久化到Nacos（生产环境推荐，避免重启丢失规则）
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: gw-flow
        degrade:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            rule-type: degrade

# JWT配置（与auth服务保持一致）
jwt:
  secret: defaultSecretKeyForTenantCloudPlatformThatIsAtLeast64BytesLongForHS512
  expiration: 1800000

# Actuator 健康检查与监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# 日志配置
logging:
  level:
    com.tenant: debug