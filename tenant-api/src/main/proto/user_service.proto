syntax = "proto3";

package com.tenant.api;

option java_multiple_files = true;
option java_package = "com.tenant.api.grpc.user";
option java_outer_classname = "UserServiceProto";

/**
 * 用户gRPC服务定义
 * 替代原Feign接口，提供服务间高性能二进制通信
 */
service UserGrpcService {

  /**
   * 根据用户名获取用户信息
   * 对应原 Feign 接口: UserService#getUserByUsername
   */
  rpc getUserByUsername (GetUserByUsernameRequest) returns (UserResponse);

  /**
   * 根据用户ID获取用户信息
   * 对应原 Feign 接口: UserService#getUserById
   */
  rpc getUserById (GetUserByIdRequest) returns (UserResponse);
}

/**
 * 根据用户名查询请求
 */
message GetUserByUsernameRequest {
  string username = 1;
}

/**
 * 根据用户ID查询请求
 */
message GetUserByIdRequest {
  int64 user_id = 1;
}

/**
 * 用户服务统一响应
 * 对应原 Result<Object>，用明确的message类型替代泛型Object
 */
message UserResponse {
  int32 code = 1;          // 响应码：200成功，400业务失败，500系统错误
  string message = 2;      // 响应消息
  UserData data = 3;       // 用户数据（可选，查询失败时为null）
}

/**
 * 用户数据
 * 对应原 User 实体（不含密码字段，安全传输）
 */
message UserData {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string email = 4;
  string phone = 5;
  int32 status = 6;        // 状态：1-启用，0-禁用
  string tenant_id = 7;    // 租户ID
}
