# ============================================================
# 分布式多租户企业级平台 — Docker Compose 编排文件
# 包含：基础设施(MySQL/Redis/Nacos) + 微服务(auth/system/gateway)
# 使用方式：docker-compose up -d
# ============================================================
version: '3.8'

services:
  # ======================== 基础设施 ========================

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: tenant-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: tenant_cloud
      MYSQL_CHARSET: utf8mb4
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenant-net

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: tenant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenant-net

  # Nacos 服务注册与配置中心
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: tenant-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD:-root}
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - tenant-net

  # ======================== 可观测性 ========================

  # SkyWalking 链路追踪
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: tenant-skywalking-oap
    environment:
      SW_STORAGE: h2
      SW_HEALTH_CHECKER: default
      SW_TELEMETRY: prometheus
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "11800:11800"   # gRPC 接收端口
      - "12800:12800"   # HTTP 接收端口
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12800/internal/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - tenant-net

  # SkyWalking UI
  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: tenant-skywalking-ui
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
      SW_ZIPKIN_ADDRESS: http://skywalking-oap:9412
    ports:
      - "8090:8080"
    depends_on:
      skywalking-oap:
        condition: service_healthy
    networks:
      - tenant-net

  # ======================== 文件存储 ========================

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: tenant-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-admin123456}
    ports:
      - "9000:9000"     # API端口
      - "9001:9001"     # 控制台端口
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenant-net

  # ======================== 任务调度 ========================

  # XXL-Job 调度中心
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: tenant-xxl-job-admin
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_PASSWORD:-root}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-}
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/xxl-job-admin"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - tenant-net

  # Sentinel 流量防护与熔断降级控制台
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.7
    container_name: tenant-sentinel-dashboard
    environment:
      JAVA_OPTS: "-Dserver.port=8079 -Dcsp.sentinel.dashboard.server=localhost:8079"
    ports:
      - "8079:8079"
    networks:
      - tenant-net

  # ======================== 微服务 ========================

  # 认证授权服务
  tenant-auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: tenant-auth
    container_name: tenant-auth
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MYSQL_URL: jdbc:mysql://mysql:3306/tenant_cloud?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      NACOS_ADDR: nacos:8848
      JWT_SECRET: ${JWT_SECRET:-defaultSecretKeyForTenantCloudPlatformThatIsAtLeast64BytesLongForHS512}
      SENTINEL_DASHBOARD: sentinel-dashboard:8079
      # SkyWalking Agent 配置
      SW_AGENT_NAME: tenant-auth
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
      SW_AGENT_SPRINGMVC_COLLECT_PATHS_PATTERN: /**
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -javaagent:/skywalking/agent/skywalking-agent.jar
        -Dskywalking.agent.service_name=tenant-auth
        -Dskywalking.collector.backend_service=skywalking-oap:11800
    volumes:
      - /usr/local/skywalking/agent:/skywalking/agent:ro
    ports:
      - "8084:8084"
      - "9094:9094"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      skywalking-oap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tenant-net

  # 系统管理服务
  tenant-system:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: tenant-system
    container_name: tenant-system
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MYSQL_URL: jdbc:mysql://mysql:3306/tenant_cloud?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      NACOS_ADDR: nacos:8848
      JWT_SECRET: ${JWT_SECRET:-defaultSecretKeyForTenantCloudPlatformThatIsAtLeast64BytesLongForHS512}
      MINIO_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER:-admin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-admin123456}
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:-}
      SENTINEL_DASHBOARD: sentinel-dashboard:8079
      # SkyWalking Agent 配置
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -javaagent:/skywalking/agent/skywalking-agent.jar
        -Dskywalking.agent.service_name=tenant-system
        -Dskywalking.collector.backend_service=skywalking-oap:11800
    volumes:
      - /usr/local/skywalking/agent:/skywalking/agent:ro
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      tenant-auth:
        condition: service_healthy
      minio:
        condition: service_healthy
      skywalking-oap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tenant-net

  # API网关服务
  tenant-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: tenant-gateway
    container_name: tenant-gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      NACOS_ADDR: nacos:8848
      JWT_SECRET: ${JWT_SECRET:-defaultSecretKeyForTenantCloudPlatformThatIsAtLeast64BytesLongForHS512}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      SENTINEL_DASHBOARD: sentinel-dashboard:8079
      # SkyWalking Agent 配置
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -javaagent:/skywalking/agent/skywalking-agent.jar
        -Dskywalking.agent.service_name=tenant-gateway
        -Dskywalking.collector.backend_service=skywalking-oap:11800
    volumes:
      - /usr/local/skywalking/agent:/skywalking/agent:ro
    ports:
      - "8086:8086"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      tenant-auth:
        condition: service_healthy
      tenant-system:
        condition: service_started
      skywalking-oap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tenant-net

# ======================== 数据卷 ========================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

# ======================== 网络 ========================
networks:
  tenant-net:
    driver: bridge