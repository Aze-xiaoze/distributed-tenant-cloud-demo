server:
  port: 8085

spring:
  application:
    name: tenant-system
  profiles:
    active: dev
  # 数据源配置（本地开发默认值，生产环境由Nacos配置中心下发）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/tenant_cloud?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    # HikariCP 连接池调优参数
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
      pool-name: TenantSystemHikariCP
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  # Sentinel 熔断降级配置
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8079}
        port: 8719
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            rule-type: degrade

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境使用 SLF4J 日志框架，通过日志级别控制 SQL 输出（避免 StdOutImpl 性能损耗和数据泄露）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT配置（与认证服务、网关保持一致）
jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForTenantCloudPlatformThatIsAtLeast64BytesLongForHS512}
  expiration: ${JWT_EXPIRATION:1800000}

# gRPC客户端配置
grpc:
  client:
    tenant-auth:
      # 本地开发使用静态地址，生产环境通过Nacos服务发现自动解析
      # 只需写服务名（与Nacos注册名一致），grpc-spring-boot-starter + Spring Cloud LoadBalancer自动完成服务发现
      negotiationType: plaintext           # 内网通信使用明文传输（生产环境可改用TLS）
      enableKeepAlive: true
      keepAliveTime: 30s
      keepAliveWithoutCalls: true

# 日志配置
logging:
  level:
    com.tenant: debug

# MinIO 文件存储配置
minio:
  url: ${MINIO_URL:}
  user: ${MINIO_USER:admin}
  password: ${MINIO_PASSWORD:admin123456}
  default-bucket: tenant-default
  max-file-size: 104857600

# XXL-Job 分布式任务调度配置（未配置时不激活）
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: tenant-system-executor
      address:
      ip:
      port: 9999
      logpath: ./logs/xxl-job/jobhandler
      logretentiondays: 30

# Knife4j API文档配置
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  group-configs:
    - group: 系统管理
      packages-to-scan: com.tenant.system.controller

# Knife4j增强配置
knife4j:
  enable: true
  # 生产环境建议开启基础认证（防止API文档泄露）
  basic:
    enable: ${KNIFE4J_BASIC_AUTH_ENABLED:false}
    username: ${KNIFE4J_BASIC_AUTH_USERNAME:admin}
    password: ${KNIFE4J_BASIC_AUTH_PASSWORD:admin123}
  setting:
    language: zh_cn
    enable-version: true

# Actuator 健康检查与监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # 数据库健康检查配置（显示连接池详细信息）
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}