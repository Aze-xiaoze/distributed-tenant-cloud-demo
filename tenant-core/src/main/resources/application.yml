# 核心模块配置（作为库依赖，不独立运行）
# 提供默认配置值，实际运行时由各业务服务的application.yml或Nacos配置中心覆盖

spring:
  # Redis默认配置（本地开发默认值，生产环境由Nacos配置中心下发）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms