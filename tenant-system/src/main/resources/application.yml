server:
  port: 8085

spring:
  application:
    name: tenant-system
  profiles:
    active: dev
  # 数据源配置（本地开发默认值，生产环境由Nacos配置中心下发）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/tenant_cloud?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT配置（与认证服务、网关保持一致）
jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForTenantCloudPlatformThatIsAtLeast64BytesLongForHS512}
  expiration: ${JWT_EXPIRATION:3600000}

# gRPC客户端配置
grpc:
  client:
    tenant-auth:
      address: 'static://127.0.0.1:9094'  # gRPC服务端地址（本地开发默认值，生产环境通过Nacos服务发现）
      negotiationType: plaintext           # 内网通信使用明文传输（生产环境可改用TLS）
      enableKeepAlive: true
      keepAliveTime: 30s
      keepAliveWithoutCalls: true

# 日志配置
logging:
  level:
    com.tenant: debug