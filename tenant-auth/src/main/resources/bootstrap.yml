# Nacos配置
spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
        # 注册gRPC端口到Nacos元数据，供客户端服务发现
        metadata:
          grpc.port: ${grpc.server.port:9094}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
        file-extension: yaml
  application:
    name: tenant-auth

# 端口配置
server:
  port: 8084